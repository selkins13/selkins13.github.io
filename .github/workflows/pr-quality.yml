name: PR Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install document validation tools
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends pandoc poppler-utils

      - name: Build and validate static site
        run: |
          scripts/build-static-site.sh "$RUNNER_TEMP/site"
          node scripts/check-site.js
          SITE_ROOT="$RUNNER_TEMP/site" node scripts/check-site.js
          node scripts/check-accessibility.js
          node scripts/check-privacy.js
          node --check assets/js/portfolio.js
          node --check scripts/check-accessibility.js
          node --check scripts/check-browser-accessibility.js
          node --check scripts/check-privacy.js
          node --check scripts/check-resume-pdf.js
          node --check scripts/check-site.js

      - name: Audit representative browser scenarios
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" >"$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.2
          done
          node --experimental-websocket scripts/check-browser-accessibility.js http://127.0.0.1:4173

      - name: Regenerate and compare resume assets
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: scripts/check-generated-resume.sh

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Audit production dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm audit --omit=dev
          elif [[ -f npm-shrinkwrap.json ]]; then
            npm audit --omit=dev
          else
            echo "No production dependency manifest is present; audit is not applicable."
          fi

      - name: Lint workflow syntax
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint"

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
          annotations: true
          collect: workflows
          inputs: .github/workflows
          min-severity: low
          online-audits: false
          persona: pedantic
          strict-collection: true
          version: 1.33.0
